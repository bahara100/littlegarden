<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스노우화이트 · 정지 V1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px 20px;background:#eeeede;color:#414653;font:15px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto}h1{font-size:27px;margin:2px 0 8px}h2{font-size:17px;margin:0 0 12px}p{color:#72777d;margin:8px 0 22px}small{color:#7f8d83;letter-spacing:.13em}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,a{font:inherit;color:#4c6258}button,.download{padding:8px 14px;border:1px solid #cbd2c6;border-radius:12px;background:#fffdf5;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#d8e4d4;border-color:#9eb89b}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article,figure{margin:0;background:#fffdf5;border:1px solid #d8ddd0;border-radius:20px;padding:18px}.stage{display:grid;place-items:center;min-height:290px;background:#dfe6d4;border-radius:12px;overflow:hidden}.stage.dark{background:#303540}.stage img{width:256px;height:256px;image-rendering:pixelated;object-fit:contain;flex-shrink:0}figcaption{text-align:center;margin-top:10px;color:#68746d}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.four figure{padding:10px}.four .stage{min-height:256px}.note{padding:16px;background:#e4e9dd;border-radius:14px}.full{margin-top:28px}@media(max-width:1000px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cards article:first-child{grid-column:1/-1}}@media(max-width:600px){body{padding:22px 12px}.cards,.four{grid-template-columns:1fr}.cards article:first-child{grid-column:auto}.stage{min-height:280px}}@media(min-width:1100px){#art{width:384px;height:384px}.cards{grid-template-columns:1fr 1.4fr 1fr}#hero{min-height:400px}}
</style>
<main><small>LITTLE GARDEN · CHARACTER STUDY</small><h1>스노우화이트 · 정지 V1</h1><p>은백색 머리와 노란 눈, 검은 고글·장갑·부츠를 살린 공통 베이스 참고 도트예요.</p>
<div class="toolbar"><button data-dir="se" aria-pressed="true">앞오른쪽 ↘</button><button data-dir="sw" aria-pressed="false">앞왼쪽 ↙</button><button data-dir="ne" aria-pressed="false">뒤오른쪽 ↗</button><button data-dir="nw" aria-pressed="false">뒤왼쪽 ↖</button><button id="backdrop" aria-pressed="false">어두운 배경</button><a class="download" href="snow-white-idle-v1.zip">PNG · 편집 원본 받기</a></div>
<section class="cards"><article><h2>공통 정지 베이스</h2><div class="stage"><img id="base" src="base-se.png" alt="정지 자세 베이스"></div><p>비율과 편안한 자세의 기준</p></article><article><h2 id="title">스노우화이트 · 앞오른쪽</h2><div class="stage" id="hero"><img id="art" src="idle-se.png" alt="스노우화이트 정지 도트"></div><p>실제 128px PNG를 정수 배율로 확대</p></article><article><h2>게임에 가까운 크기</h2><div class="stage"><img id="small" src="idle-se.png" style="width:128px;height:128px" alt="원래 크기의 도트"></div><p>확대 그림과 같은 PNG예요.</p></article></section>
<h2 class="full">네 방향 모아보기</h2><section class="four">
<figure><div class="stage"><img src="idle-se.png" alt="앞오른쪽"></div><figcaption>앞오른쪽 ↘</figcaption></figure><figure><div class="stage"><img src="idle-sw.png" alt="앞왼쪽"></div><figcaption>앞왼쪽 ↙</figcaption></figure><figure><div class="stage"><img src="idle-ne.png" alt="뒤오른쪽"></div><figcaption>뒤오른쪽 ↗</figcaption></figure><figure><div class="stage"><img src="idle-nw.png" alt="뒤왼쪽"></div><figcaption>뒤왼쪽 ↖</figcaption></figure></section>
<p class="note">정지 자세 외형 검수용이에요. 앞·뒤 두 원화를 만들고 왼쪽 방향은 좌우 반전했어요. 걷기·앉기와 맵 연결은 아직 적용하지 않았어요.</p></main>
<script>
const labels={se:'앞오른쪽',sw:'앞왼쪽',ne:'뒤오른쪽',nw:'뒤왼쪽'};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d=b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));for(const id of ['art','small'])document.getElementById(id).src=`idle-${d}.png`;const base=document.getElementById('base');base.src=`base-${d.startsWith('s')?'se':'ne'}.png`;base.style.transform=d.endsWith('w')?'scaleX(-1)':'';document.getElementById('title').textContent=`스노우화이트 · ${labels[d]}`});document.getElementById('backdrop').onclick=e=>{const pressed=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(pressed));document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('dark',pressed))};
</script></html>
