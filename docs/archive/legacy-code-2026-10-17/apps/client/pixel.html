<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홍련 · 도트 작업실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0f7;color:#493c53;font:15px/1.7 system-ui,sans-serif}main{max-width:1060px;margin:40px auto;padding:0 24px}small{letter-spacing:3px;color:#9b819e}h1{margin:6px 0;font-size:32px}p{color:#89788f}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin:26px 0}.stage{min-height:430px;border:1px solid #ded1e5;border-radius:24px;display:grid;place-items:center;background-color:#ede4f1;background-image:linear-gradient(45deg,#e5daeb 25%,transparent 25%),linear-gradient(-45deg,#e5daeb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5daeb 75%),linear-gradient(-45deg,transparent 75%,#e5daeb 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}canvas{image-rendering:pixelated;width:288px;height:288px}aside{padding:24px;background:#fffafc;border:1px solid #e4d7e8;border-radius:24px}button,a{display:inline-block;border:1px solid #d7c6df;border-radius:10px;padding:9px 16px;color:#735782;background:#fffafc;text-decoration:none;font:inherit;cursor:pointer;margin:4px 3px 4px 0}button[aria-pressed=true],a.primary{background:#80658f;color:white}button:disabled{opacity:.4}label{display:block;margin-top:22px}select{padding:7px;border:1px solid #d7c6df;border-radius:8px}#message{font-size:13px}.note{font-size:13px}a:focus-visible,button:focus-visible{outline:3px solid #bc90d2}@media(max-width:700px){.layout{grid-template-columns:1fr}main{margin:20px auto}.stage{min-height:350px}}
</style></head><body><main><small>SCARLET / PIXEL WORKSHOP</small><h1>홍련, 작은 도트로</h1><p>대각선 대기와 걷기 · 맵 시점에 맞춘 두 번째 실험</p><div class="layout"><section class="stage" aria-label="홍련 도트 애니메이션"><canvas id="pixel" width="96" height="96" aria-label="96픽셀 홍련 대각선"></canvas></section><aside><h2>작지만 또렷하게</h2><p>삿갓과 은보라색 머리,<br>홍련의 붉은 허리띠.</p><button id="idle" aria-pressed="true" disabled>대기</button><button id="walk" aria-pressed="false" disabled>걷기</button><button id="pause" aria-pressed="false" disabled>일시 정지</button><label for="scale">표시 크기 <select id="scale"><option value="1">1배 · 96px</option><option value="2">2배 · 192px</option><option value="3" selected>3배 · 288px</option></select></label><p id="message" role="status">도트 시트를 불러오는 중이에요.</p><a class="primary" href="./?art=pixel">놀이터에서 움직여보기 ↗</a><a href="./sprites/scarlet/scarlet-pixel-sheet-v2-iso.png" download>원본 시트 받기 ↓</a></aside></div><p class="note">96×96 표시 기준 · 대기 4컷 / 걷기 4컷. AI 생성 시트를 사용하는 첫 시제품으로, 프레임 사이 외형 차이가 남아 있습니다. 위에서 내려다본 오른쪽 아래 대각선 한 방향입니다. 다른 방향·인사·앉기 전용 도트는 아직 없습니다.</p><a href="./">기존 놀이터</a></main><script type="module" src="/src/pixelPreview.ts"></script></body></html>
