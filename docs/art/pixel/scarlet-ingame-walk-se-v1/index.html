<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홍련 새 SD · 네 방향 걷기</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#372c43;background:#f3eef7;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 6px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.stage{background:repeating-conic-gradient(#e1dbe9 0 25%,#f8f5fb 0 50%) 0/24px 24px;border-radius:18px;overflow:hidden}.stage canvas{display:block;width:100%;image-rendering:pixelated}button,select{font:inherit;padding:8px 12px;border:1px solid #c8b5d7;border-radius:10px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#dfcfe9}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.tools label{display:block}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.timeline button{padding:0;overflow:hidden}.timeline canvas{width:100%;display:block;image-rendering:pixelated}.timeline span{display:block;padding:8px;font-size:13px}.muted{color:#766880;font-size:14px}a{color:#714e91}@media(max-width:650px){.hero{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}}
</style><style>.directions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.directions button{padding:0;overflow:hidden}.directions canvas{width:100%;display:block;image-rendering:pixelated}.directions span{display:block;padding:5px}@media(max-width:650px){.directions{grid-template-columns:repeat(2,1fr)}}</style>
<style>.contacts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.contacts button{padding:0;overflow:hidden}.contacts canvas{display:block;width:100%;image-rendering:pixelated}.contacts span{display:block;padding:8px}</style>
<main><h1>홍련 · 네 방향 걷기</h1><div class="muted">앞·뒤 원본 두 방향 + 좌우 반전 · 전신 4컷 · 기본 6 FPS</div><p class="muted">뒤오른쪽 3·4번 칼집의 끊긴 도트를 보완했습니다. 걷기 자세는 그대로입니다.</p>
<section class="directions" id="directions" aria-label="방향 선택"></section>
<h2>1번·3번 접지 비교</h2><section class="contacts" id="contacts" aria-label="반대 접지 두 자세"><button data-frame="0"><canvas width="96" height="96"></canvas><span>1번 · 왼발 접지</span></button><button data-frame="2"><canvas width="96" height="96"></canvas><span>3번 · 오른발 접지</span></button></section>
<section class="hero"><div class="stage"><canvas id="preview" width="96" height="96" aria-label="홍련 걷기 반복 재생"></canvas></div><div><h2 id="direction-title">뒤오른쪽 ↗</h2><h3 id="phase">불러오는 중</h3><p id="direction-note"></p><div class="tools"><button id="play">일시 정지</button><button id="next">한 컷 앞으로</button><select id="rate" aria-label="재생 속도"><option value="3">천천히 · 3 FPS</option><option value="6" selected>기본 · 6 FPS</option></select><label><input id="onion" type="checkbox"> 이전 컷 겹치기</label><label><input id="guides" type="checkbox"> 발 기준선</label></div><p class="muted">1→2→3→4→1에서 발 교차와 접지, 팔 스윙, 머리 높낮이를 확인해 주세요.</p><a id="sheet-link" href="ne/walk.png">원본 시트 보기</a> · <a id="grid-link" href="ne/walk-preview-2x2.png">원본 네 컷 보기</a> · <a id="gif-link" href="ne/walk-preview.gif">원본 반복 GIF 보기</a></div></section><section class="timeline" id="frames" aria-label="선택 방향 걷기 네 컷"></section><p class="muted">앞오른쪽은 확인한 버전을 유지했습니다. 뒤오른쪽과 반전 방향은 이번 검수 대상이며 기존 게임과 별도로 확인합니다.</p></main>
<script>
const images={se:new Image(),ne:new Image()},preview=document.querySelector('#preview'),ctx=preview.getContext('2d'),labels=['왼발 접지','오른발 통과','오른발 접지','왼발 통과'];
const directions={se:{title:'앞오른쪽 ↘',source:'se',flip:false},sw:{title:'앞왼쪽 ↙',source:'se',flip:true},ne:{title:'뒤오른쪽 ↗',source:'ne',flip:false},nw:{title:'뒤왼쪽 ↖',source:'ne',flip:true}};
const assetFiles={se:{sheet:"walk.png",grid:"walk-preview-2x2.png",gif:"walk-preview.gif"},ne:{sheet:"ne/walk-v9.png",grid:"ne/walk-preview-v9-2x2.png",gif:"ne/walk-preview-v9.gif"}};
let ready=false,paused=false,n=0,last=0,time=0,fps=6,onion=false,guides=false,direction='ne';
function poseLabels(){return directions[direction].source==="ne"?["왼발 접지","오른발 통과","오른발 접지","왼발 통과"]:labels}
function draw(c,i,ghost=false,key=direction){const d=directions[key],image=images[d.source];c.clearRect(0,0,96,96);c.imageSmoothingEnabled=false;c.save();if(d.flip){c.translate(96,0);c.scale(-1,1)}if(ghost){c.globalAlpha=.3;c.drawImage(image,((i+3)%4)*96,0,96,96,0,0,96,96);c.globalAlpha=1}c.drawImage(image,i*96,0,96,96,0,0,96,96);c.restore();if(guides){c.fillStyle='#8da080';c.fillRect(0,88,96,1)}}
function render(){if(!ready)return;document.querySelectorAll("#contacts button").forEach(b=>{const frame=Number(b.dataset.frame);draw(b.querySelector("canvas").getContext("2d"),frame);b.setAttribute("aria-pressed",String(n===frame))});const d=directions[direction],base=d.source==='ne'?'ne/':'';draw(ctx,n,onion);document.querySelector('#phase').textContent=`${n+1} / 4 · ${poseLabels()[n]}${d.flip?' (반전 원본 기준)':''}`;document.querySelector('#direction-title').textContent=d.title;document.querySelector('#direction-note').textContent=direction==='ne'&&n===2?'3번 칼집 연결부의 도트만 보완했습니다.':direction==='ne'&&n===3?'4번 칼집의 연결부와 가장자리 도트만 보완했습니다. 다리 자세는 그대로입니다.':d.flip?'오른쪽 원본을 컷별로 좌우 반전합니다. 비대칭 의상과 칼 위치도 함께 반전됩니다.':'왼다리는 주름 부츠, 오른다리는 매끈한 흰 다리입니다.';document.querySelector('#sheet-link').href=assetFiles[d.source].sheet;document.querySelector('#grid-link').href=assetFiles[d.source].grid;document.querySelector('#gif-link').href=assetFiles[d.source].gif;document.querySelector('#play').textContent=paused?'다시 재생':'일시 정지';document.querySelectorAll('#frames button').forEach((b,i)=>{b.querySelector("span").textContent=(i+1)+". "+poseLabels()[i];b.setAttribute('aria-pressed',String(i===n));draw(b.querySelector('canvas').getContext('2d'),i)});document.querySelectorAll('#directions button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.direction===direction));draw(b.querySelector('canvas').getContext('2d'),n,false,b.dataset.direction)})}
function tick(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(ready&&!paused){time+=dt;const next=Math.floor(time*fps)%4;if(next!==n){n=next;render()}}requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{paused=!paused;render()};document.querySelector('#next').onclick=()=>{paused=true;n=(n+1)%4;time=n/fps;render()};document.querySelector('#rate').onchange=e=>{fps=Number(e.target.value);time=n/fps};document.querySelector('#onion').onchange=e=>{onion=e.target.checked;render()};document.querySelector('#guides').onchange=e=>{guides=e.target.checked;render()};
document.querySelectorAll("#contacts button").forEach(b=>{b.onclick=()=>{paused=true;n=Number(b.dataset.frame);time=n/fps;render()}});
Promise.all(Object.entries(images).map(([key,image])=>new Promise((resolve,reject)=>{image.onload=()=>image.width===384&&image.height===96?resolve():reject(Error('Invalid sheet'));image.onerror=reject;image.src=assetFiles[key].sheet}))).then(()=>{ready=true;labels.forEach((label,i)=>{const b=document.createElement('button'),c=document.createElement('canvas'),s=document.createElement('span');c.width=c.height=96;s.textContent=`${i+1}. ${label}`;b.append(c,s);b.onclick=()=>{paused=true;n=i;time=i/fps;render()};document.querySelector('#frames').append(b)});Object.entries(directions).forEach(([key,d])=>{const b=document.createElement('button'),c=document.createElement('canvas'),s=document.createElement('span');c.width=c.height=96;b.dataset.direction=key;s.textContent=d.title+(d.flip?' · 반전':' · 원본');b.append(c,s);b.onclick=()=>{direction=key;render()};document.querySelector('#directions').append(b)});render()}).catch(()=>{document.querySelector('#phase').textContent='시트를 불러오지 못했습니다. 새로고침해 주세요.'});requestAnimationFrame(tick);
</script></html>
