name: Publish game to Pages
# Deploys only after Verify (type check, rule tests, build, screen tests) has passed for a push to main, so a broken
# game never reaches the public site. Run it by hand (workflow_dispatch) to redeploy the current main.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A check that finishes late for an older commit must not replace a newer one already on the site.
      - name: Still the newest commit on main?
        id: newest
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$(git rev-parse HEAD)" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit ($latest) will deploy instead."; fi
      - uses: actions/setup-node@v7
        if: steps.newest.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.newest.outputs.deploy == 'true'
      # oxipng recompresses the built PNGs losslessly (vite.config.ts). Pinned release, checked against its published hash.
      - name: Install oxipng
        if: steps.newest.outputs.deploy == 'true'
        run: |
          curl -fsSL -o /tmp/oxipng.tgz https://github.com/shssoichiro/oxipng/releases/download/v10.2.1/oxipng-10.2.1-x86_64-unknown-linux-musl.tar.gz
          echo "1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17  /tmp/oxipng.tgz" | sha256sum -c -
          tar -xzf /tmp/oxipng.tgz -C /tmp
          sudo install /tmp/oxipng-10.2.1-x86_64-unknown-linux-musl/oxipng /usr/local/bin/oxipng
      - run: npm run build -w apps/client
        if: steps.newest.outputs.deploy == 'true'
      - uses: actions/configure-pages@v6
        if: steps.newest.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.newest.outputs.deploy == 'true'
        with:
          path: apps/client/dist
      - name: Deploy
        id: deployment
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
