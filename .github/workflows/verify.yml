name: Verify
on: [push, pull_request, workflow_dispatch]
# Checks the game only. The preserved multiplayer code (apps/server, tests/*.test.ts) is checked by hand when
# needed: npm run check:legacy, npm run build -w apps/server, npm run test:legacy.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
