name: Verify
on: [push, pull_request, workflow_dispatch]
# Checks the game only. The preserved multiplayer code (apps/server, tests/*.test.ts) is checked by hand when
# needed: npm run check:legacy, npm run build -w apps/server, npm run test:legacy.
jobs:
  verify:
    runs-on: ubuntu-24.04  # pinned: move up to a newer Ubuntu after checking Playwright installs there
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Screen tests in a headless browser against the built game (playwright.config.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
